name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    name: Build & Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make wrapper executable (Linux)
        if: runner.os == 'Linux'
        run: chmod +x mvnw

      - name: Build, Test & Verify (Linux)
        if: runner.os == 'Linux'
        run: ./mvnw -B verify

      - name: Build, Test & Verify (Windows)
        if: runner.os == 'Windows'
        run: cmd.exe /c mvnw.cmd -B verify
